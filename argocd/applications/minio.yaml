apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: minio
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://charts.min.io/
    targetRevision: 5.0.14
    chart: minio
    helm:
      values: |
        replicas: 1
        persistence:
          enabled: false
          size: 5Gi
        resources:
          requests:
            memory: 128Mi
            cpu: 100m
        mode: standalone
        rootUser: minioadmin
        rootPassword: minioadmin123
        buckets:
          - name: mlflow-artifacts
            policy: none
            purge: false
        service:
          type: ClusterIP
          port: 9000
        consoleService:
          type: NodePort
          nodePort: 30090
  destination:
    server: https://kubernetes.default.svc
    namespace: mlflow
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true