apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pushgateway
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    targetRevision: 2.14.0
    chart: prometheus-pushgateway
    helm:
      values: |
        service:
          type: ClusterIP
          port: 9091
        resources:
          requests:
            memory: 128Mi
            cpu: 100m
        serviceMonitor:
          enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
